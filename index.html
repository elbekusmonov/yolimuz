  "Where to do it in Fergana region": ["Farg'ona viloyatida qayerda qilish mumkin", "Где это сделать в Ферганской области"], "Where to do it near you": ["Yaqiningizda qayerda qilish mumkin", "Где это сделать рядом с вами"],
  "Public Service Centres (Davlat xizmatlari markazi) in every city and district: copies, apostille and other document services, also online at my.gov.uz.": ["Har bir shahar va tumandagi Davlat xizmatlari markazlari: nusxalar, apostil va boshqa hujjat xizmatlari, my.gov.uz orqali onlayn ham.", "Центры госуслуг (Davlat xizmatlari markazi) в каждом городе и районе: копии, апостиль и другие услуги по документам, также онлайн на my.gov.uz."],
  "Notary offices in your city: certified translations of your certificate, transcript and passport.": ["Shahringizdagi notarial idoralar: shahodatnoma, baholar ilovasi va pasportning tasdiqlangan tarjimalari.", "Нотариальные конторы в вашем городе: заверенные переводы аттестата, приложения и паспорта."],
  "IELTS test venues: Fergana State University (19 Murabbiylar street) and Kokand University. Book online at britishcouncil.uz.": ["IELTS imtihon joylari: Farg'ona davlat universiteti (Murabbiylar ko'chasi, 19) va Kokand University. britishcouncil.uz orqali onlayn yoziling.", "Площадки IELTS: Ферганский государственный университет (ул. Мураббийлар, 19) и Kokand University. Запись онлайн на britishcouncil.uz."],
  "IELTS test centre: Edu-Action Fergana, 14A Shukrona street, +998 71 230 01 03.": ["IELTS imtihon markazi: Edu-Action Fergana, Shukrona ko'chasi, 14A, +998 71 230 01 03.", "Центр IELTS: Edu-Action Fergana, ул. Шукрона, 14A, +998 71 230 01 03."],
  "Close your gaps first": ["Avval kamchiliklarni to'ldiring", "Сначала закройте пробелы"], "Centres that prepare students": ["O'quvchilarni tayyorlaydigan markazlar", "Центры, которые готовят учеников"],
  "Scholarships to check": ["Tekshirish kerak bo'lgan grantlar", "Стипендии, которые стоит проверить"], "Official links": ["Rasmiy havolalar", "Официальные ссылки"], "Back home in Uzbekistan": ["O'zbekistonga qaytganda", "По возвращении в Узбекистан"],
  "Yo‘lim is a planning aid. Requirements, fees and dates change every year. Check every step on the university's official website before you apply.": ["Yo‘lim rejalashtirish uchun yordamchi. Talablar, to'lovlar va sanalar har yili o'zgaradi. Hujjat topshirishdan oldin har bir qadamni universitetning rasmiy saytida tekshiring.", "Yo‘lim — помощник для планирования. Требования, сборы и даты меняются каждый год. Перед подачей проверьте каждый шаг на официальном сайте университета."],
  /* PDF guide: steps */
  "Get your ID card or passport and your school or college certificate (attestat or diploma) with the transcript of grades.": ["ID karta yoki pasportingizni va maktab yoki kollej shahodatnomangizni (attestat yoki diplom) baholar ilovasi bilan tayyorlang.", "Подготовьте ID-карту или паспорт и аттестат или диплом колледжа с приложением оценок."],
  "During the application window (in 2026 it ran from 5 to 25 June; check uzbmb.uz), register at my.uzbmb.uz and choose your study directions, including {0}.": ["Qabul davrida (2026-yilda 5–25 iyun kunlari bo'lgan; uzbmb.uz da tekshiring) my.uzbmb.uz da ro'yxatdan o'ting va ta'lim yo'nalishlaringizni, jumladan {0}ni tanlang.", "В период приёма (в 2026 году — с 5 по 25 июня; проверьте на uzbmb.uz) зарегистрируйтесь на my.uzbmb.uz и выберите направления, включая {0}."],
  "Pay the test fee in your my.uzbmb.uz account and save your test pass.": ["Test to'lovini my.uzbmb.uz kabinetingizda to'lang va test ruxsatnomasini saqlab qo'ying.", "Оплатите тест в кабинете my.uzbmb.uz и сохраните пропуск на тест."],
  "Take the entrance test on the date and at the test site shown in your account. Language certificates such as CEFR can count towards some subjects; check this year's rules.": ["Kirish testini kabinetingizda ko'rsatilgan sana va joyda topshiring. CEFR kabi til sertifikatlari ayrim fanlar uchun hisobga olinishi mumkin; shu yilgi qoidalarni tekshiring.", "Сдайте вступительный тест в дату и на площадке, указанные в кабинете. Языковые сертификаты (например, CEFR) могут засчитываться по некоторым предметам; проверьте правила этого года."],
  "Check your score and the state grant and contract lists in your my.uzbmb.uz account.": ["Balingizni hamda davlat granti va kontrakt ro'yxatlarini my.uzbmb.uz kabinetingizda tekshiring.", "Проверьте свой балл и списки госгранта и контракта в кабинете my.uzbmb.uz."],
  "If you win a grant or a contract place, follow {0}'s instructions to enrol and, for a contract place, sign and pay the contract on time.": ["Grant yoki kontrakt asosida o'qishga kirsangiz, {0} ko'rsatmalariga ko'ra ro'yxatdan o'ting; kontrakt bo'lsa, shartnomani o'z vaqtida imzolab to'lang.", "Если вы прошли на грант или контракт, зачислитесь по инструкциям {0}; при контракте вовремя подпишите и оплатите договор."],
  "Open the admissions page of {0} and read this year's programmes, fees and entry rules.": ["{0} qabul sahifasini oching va shu yilgi dasturlar, to'lovlar va qabul qoidalarini o'qing.", "Откройте страницу приёма {0} и изучите программы, стоимость и правила поступления этого года."],
  "Create an account on the university's application portal and fill in the form.": ["Universitetning ariza portalida hisob oching va shaklni to'ldiring.", "Создайте аккаунт на портале подачи заявок университета и заполните форму."],
  "Upload your passport, certificate and transcript, a photo and your English result (about IELTS {1}, or the university's own English test).": ["Pasport, shahodatnoma va baholar ilovasi, rasm va ingliz tili natijangizni (taxminan IELTS {1} yoki universitetning o'z testi) yuklang.", "Загрузите паспорт, аттестат с приложением, фото и результат по английскому (около IELTS {1} или собственный тест университета)."],
  "Sit the university's entrance test or interview if it has one. Book the date early.": ["Universitetda kirish testi yoki suhbat bo'lsa, topshiring. Sanani oldindan band qiling.", "Если у университета есть вступительный тест или собеседование, пройдите его. Запишитесь заранее."],
  "Apply for merit discounts or grants at the same time; they often close on the same day.": ["Chegirma yoki grantlarga ham bir vaqtda ariza bering; ular ko'pincha shu kuni yopiladi.", "Одновременно подайте на скидки и гранты: их приём часто заканчивается в тот же день."],
  "Accept the offer, sign the contract and pay the first instalment by the date in your offer.": ["Taklifni qabul qiling, shartnomani imzolang va birinchi to'lovni taklifdagi sanagacha to'lang.", "Примите предложение, подпишите договор и внесите первый платёж до даты, указанной в предложении."],
  "Make a list of 6 to 10 universities in the USA, including {0}, and note each deadline (Early Action or Early Decision in November, Regular Decision in January).": ["AQShdagi 6–10 ta universitet ro'yxatini tuzing, jumladan {0}, va har birining muddatini yozib oling (Early Action yoki Early Decision noyabrda, Regular Decision yanvarda).", "Составьте список из 6–10 университетов США, включая {0}, и запишите сроки (Early Action или Early Decision — в ноябре, Regular Decision — в январе)."],
  "Create a Common App account at commonapp.org, or use the university's own portal if it does not take the Common App.": ["commonapp.org da Common App hisobini oching yoki universitet Common App ni qabul qilmasa, uning portalidan foydalaning.", "Создайте аккаунт Common App на commonapp.org или используйте портал университета, если он не принимает Common App."],
  "Register for the SAT at sat.org if {0} asks for it, and for an English test (about IELTS {1}, or TOEFL or Duolingo if accepted).": ["{0} talab qilsa, sat.org orqali SAT ga, shuningdek ingliz tili testiga (taxminan IELTS {1}, yoki qabul qilinsa TOEFL yoki Duolingo) yoziling.", "Запишитесь на SAT на sat.org, если его требует {0}, и на тест по английскому (около IELTS {1}, или TOEFL и Duolingo, если их принимают)."],
  "Ask your school for your grades for the last four years translated into English, and ask two teachers and a counsellor for recommendation letters.": ["Maktabingizdan so'nggi to'rt yillik baholaringizni ingliz tiliga tarjima qilib berishni, ikki o'qituvchi va maslahatchidan tavsiyanoma yozishni so'rang.", "Попросите в школе оценки за последние четыре года с переводом на английский, а двух учителей и консультанта — рекомендательные письма."],
  "Write the personal essay (up to 650 words) and the university's own short essays.": ["Shaxsiy inshoni (650 so'zgacha) va universitetning qisqa inshoarini yozing.", "Напишите личное эссе (до 650 слов) и короткие эссе университета."],
  "For financial aid, fill in the CSS Profile or the university's own aid form with your family's income documents.": ["Moliyaviy yordam uchun CSS Profile yoki universitetning yordam shaklini oilangiz daromadi hujjatlari bilan to'ldiring.", "Для финансовой помощи заполните CSS Profile или форму университета, приложив документы о доходах семьи."],
  "After admission, pay the deposit, receive the I-20 form, pay the SEVIS fee and book an F-1 visa interview at the US Embassy in Tashkent.": ["Qabul qilingach, depozitni to'lang, I-20 shaklini oling, SEVIS to'lovini qiling va Toshkentdagi AQSh elchixonasida F-1 viza suhbatiga yoziling.", "После зачисления внесите депозит, получите форму I-20, оплатите сбор SEVIS и запишитесь на собеседование на визу F-1 в посольстве США в Ташкенте."],
  "Check the entry rules of {0}. An Uzbek school certificate alone is often not enough, so many students first take a foundation year or one year of university at home.": ["{0} qabul qoidalarini tekshiring. Faqat O'zbekiston maktab attestati ko'pincha yetmaydi, shuning uchun ko'p o'quvchilar avval foundation yili yoki vatanda bir yil universitetda o'qiydi.", "Проверьте правила приёма {0}. Узбекского аттестата часто недостаточно, поэтому многие сначала проходят foundation year или год учатся в университете дома."],
  "Register on UCAS at ucas.com and add up to five courses, including {0}.": ["ucas.com da UCAS ga ro'yxatdan o'ting va beshtagacha kurs, jumladan {0}ni qo'shing.", "Зарегистрируйтесь в UCAS на ucas.com и добавьте до пяти программ, включая {0}."],
  "Write one personal statement for all your choices and ask a teacher for a reference.": ["Barcha tanlovlaringiz uchun bitta personal statement yozing va o'qituvchidan tavsiya so'rang.", "Напишите одно personal statement для всех выбранных программ и попросите учителя о рекомендации."],
  "Take IELTS for UKVI or the English test the university accepts (about {1}).": ["IELTS for UKVI yoki universitet qabul qiladigan ingliz tili testini topshiring (taxminan {1}).", "Сдайте IELTS for UKVI или тест по английскому, который принимает университет (около {1})."],
  "Submit before the UCAS deadline (late January for most courses) and pay the UCAS fee.": ["UCAS muddatidan oldin (ko'p kurslar uchun yanvar oxiri) topshiring va UCAS to'lovini qiling.", "Подайте заявку до срока UCAS (для большинства программ — конец января) и оплатите сбор UCAS."],
  "After an unconditional offer you receive a CAS number. Apply for the Student visa online and pay the health surcharge.": ["Shartsiz taklifdan keyin CAS raqamini olasiz. Student vizasiga onlayn ariza bering va tibbiy yig'imni to'lang.", "После безусловного предложения вы получите номер CAS. Подайте онлайн на Student visa и оплатите медицинский сбор."],
  "Check whether your certificate gives direct entry. With an Uzbek school certificate you usually need a Studienkolleg (foundation course) or one to two years of university study at home first. The DAAD admission database and anabin explain the rules.": ["Shahodatnomangiz to'g'ridan-to'g'ri kirish huquqini berishini tekshiring. O'zbekiston maktab attestati bilan odatda avval Studienkolleg (tayyorlov kursi) yoki vatanda bir-ikki yil universitetda o'qish kerak. Qoidalar DAAD bazasi va anabin da tushuntirilgan.", "Проверьте, даёт ли ваш документ прямой доступ к учёбе. С узбекским аттестатом обычно нужен Studienkolleg (подготовительный курс) или один-два года учёбы в университете дома. Правила объясняют база DAAD и anabin."],
  "Find out whether {0} takes applications through uni-assist (uni-assist.de) or through its own portal.": ["{0} arizalarni uni-assist (uni-assist.de) orqali yoki o'z portali orqali qabul qilishini aniqlang.", "Узнайте, принимает ли {0} заявки через uni-assist (uni-assist.de) или через собственный портал."],
  "Prepare certified copies and translations of your certificate, transcript and passport.": ["Shahodatnoma, baholar ilovasi va pasportning tasdiqlangan nusxalari va tarjimalarini tayyorlang.", "Подготовьте заверенные копии и переводы аттестата, приложения и паспорта."],
  "Prove your language: German (TestDaF or DSH) for German-taught courses, or about IELTS {1} for English-taught ones.": ["Til bilimingizni isbotlang: nemis tilidagi kurslar uchun nemis tili (TestDaF yoki DSH), ingliz tilidagilar uchun taxminan IELTS {1}.", "Подтвердите язык: немецкий (TestDaF или DSH) для программ на немецком или около IELTS {1} для программ на английском."],
  "Submit before the deadline: often 15 July for the winter semester and 15 January for the summer semester.": ["Muddatdan oldin topshiring: qishki semestr uchun ko'pincha 15-iyul, yozgi semestr uchun 15-yanvar.", "Подайте до срока: часто 15 июля на зимний семестр и 15 января на летний."],
  "After admission, open a blocked account for living costs, get health insurance and apply for a student visa at the German Embassy in Tashkent.": ["Qabul qilingach, yashash xarajatlari uchun blokirovka qilingan hisob oching, tibbiy sug'urta oling va Toshkentdagi Germaniya elchixonasida talaba vizasiga ariza bering.", "После зачисления откройте блокированный счёт на расходы, оформите медстраховку и подайте на студенческую визу в посольстве Германии в Ташкенте."],
  "Choose the route: apply directly to {0}, or through the Global Korea Scholarship (GKS), whose embassy track goes through the Korean Embassy in Tashkent.": ["Yo'lni tanlang: to'g'ridan-to'g'ri {0}ga yoki Global Korea Scholarship (GKS) orqali; uning elchixona yo'nalishi Toshkentdagi Koreya elchixonasi orqali o'tadi.", "Выберите путь: подать напрямую в {0} или через Global Korea Scholarship (GKS), посольский трек которой идёт через посольство Кореи в Ташкенте."],
  "Download the international admission guide from the university's website and note the spring and autumn intake dates.": ["Universitet saytidan xalqaro qabul qo'llanmasini yuklab oling va bahorgi hamda kuzgi qabul sanalarini yozib oling.", "Скачайте с сайта университета руководство для иностранных абитуриентов и запишите даты весеннего и осеннего набора."],
  "Prepare your certificate and transcript with an apostille or consular confirmation, plus translations.": ["Shahodatnoma va baholar ilovasini apostil yoki konsullik tasdig'i hamda tarjimalar bilan tayyorlang.", "Подготовьте аттестат и приложение с апостилем или консульским подтверждением, а также переводы."],
  "Show your language: TOPIK for Korean-taught courses, or about IELTS {1} for English-taught ones.": ["Til bilimingizni ko'rsating: koreys tilidagi kurslar uchun TOPIK, ingliz tilidagilar uchun taxminan IELTS {1}.", "Подтвердите язык: TOPIK для программ на корейском или около IELTS {1} для программ на английском."],
  "Submit the online application, send the documents and pay the application fee.": ["Onlayn ariza topshiring, hujjatlarni yuboring va ariza to'lovini qiling.", "Подайте онлайн-заявку, отправьте документы и оплатите сбор."],
  "After admission, receive the Certificate of Admission and apply for a D-2 student visa.": ["Qabul qilingach, Certificate of Admission ni oling va D-2 talaba vizasiga ariza bering.", "После зачисления получите Certificate of Admission и подайте на студенческую визу D-2."],
  "Decide whether to apply directly to {0} or with the Chinese Government Scholarship (CSC) through campuschina.org.": ["To'g'ridan-to'g'ri {0}ga yoki campuschina.org orqali Xitoy hukumati granti (CSC) bilan topshirishni hal qiling.", "Решите, подавать ли напрямую в {0} или со стипендией правительства Китая (CSC) через campuschina.org."],
  "Fill in the university's online application, and the CSC form if you apply for the scholarship.": ["Universitetning onlayn arizasini, grantga topshirsangiz CSC shaklini ham to'ldiring.", "Заполните онлайн-заявку университета, а при подаче на стипендию ещё и форму CSC."],
  "Upload your certificate, transcript, passport, two recommendation letters, a study plan and the Foreigner Physical Examination Form.": ["Shahodatnoma, baholar ilovasi, pasport, ikkita tavsiyanoma, o'qish rejasi va Foreigner Physical Examination Form ni yuklang.", "Загрузите аттестат, приложение, паспорт, два рекомендательных письма, учебный план и Foreigner Physical Examination Form."],
  "Show your language: HSK for Chinese-taught courses, or about IELTS {1} for English-taught ones.": ["Til bilimingizni ko'rsating: xitoy tilidagi kurslar uchun HSK, ingliz tilidagilar uchun taxminan IELTS {1}.", "Подтвердите язык: HSK для программ на китайском или около IELTS {1} для программ на английском."],
  "After admission you receive the admission notice and the JW201 or JW202 form.": ["Qabul qilingach, qabul xabarnomasi va JW201 yoki JW202 shaklini olasiz.", "После зачисления вы получите уведомление о зачислении и форму JW201 или JW202."],
  "Apply for an X1 student visa at the Chinese Embassy in Tashkent.": ["Toshkentdagi Xitoy elchixonasida X1 talaba vizasiga ariza bering.", "Подайте на студенческую визу X1 в посольстве Китая в Ташкенте."],
  "Choose the route: apply directly to {0} through its international student portal, or apply for Türkiye Scholarships at turkiyeburslari.gov.tr (usually January to February).": ["Yo'lni tanlang: {0}ning xalqaro talabalar portali orqali to'g'ridan-to'g'ri yoki turkiyeburslari.gov.tr da Türkiye Bursları grantiga (odatda yanvar–fevral).", "Выберите путь: подать напрямую в {0} через портал для иностранцев или на стипендию Türkiye Bursları на turkiyeburslari.gov.tr (обычно январь–февраль)."],
  "Check which exam {0} accepts from foreign students: its own entrance test, the SAT or your school grade average.": ["{0} xorijlik talabalardan qaysi imtihonni qabul qilishini tekshiring: o'z kirish testi, SAT yoki maktab o'rtacha bahosi.", "Узнайте, какой экзамен {0} принимает у иностранцев: собственный тест, SAT или средний балл аттестата."],
  "Upload your certificate, transcript, passport and a photo, and pay the fee if there is one.": ["Shahodatnoma, baholar ilovasi, pasport va rasmni yuklang, to'lov bo'lsa, to'lang.", "Загрузите аттестат, приложение, паспорт и фото и оплатите сбор, если он есть."],
  "Show your language: Turkish (TÖMER) or about IELTS {1} for English-taught courses. Many students take a one-year Turkish preparation course.": ["Til bilimingizni ko'rsating: turk tili (TÖMER) yoki ingliz tilidagi kurslar uchun taxminan IELTS {1}. Ko'p talabalar bir yillik turk tili tayyorlov kursida o'qiydi.", "Подтвердите язык: турецкий (TÖMER) или около IELTS {1} для программ на английском. Многие проходят годичный курс турецкого."],
  "After admission, receive the acceptance letter, apply for a student visa and, within a month of arrival, a residence permit.": ["Qabul qilingach, qabul xatini oling, talaba vizasiga va kelganingizdan keyin bir oy ichida yashash ruxsatnomasiga ariza bering.", "После зачисления получите письмо о зачислении, оформите студенческую визу, а в течение месяца после приезда — вид на жительство."],
  "Choose the route: the Russian Government quota (free tuition) at education-in-russia.com, usually open in autumn, or a contract place directly with {0}.": ["Yo'lni tanlang: education-in-russia.com dagi Rossiya hukumati kvotasi (bepul o'qish, odatda kuzda ochiladi) yoki to'g'ridan-to'g'ri {0}da kontrakt asosida.", "Выберите путь: квота Правительства России (бесплатное обучение) на education-in-russia.com, обычно открывается осенью, или контракт напрямую с {0}."],
  "Prepare your passport, certificate and transcript, translated into Russian and certified by a notary.": ["Pasport, shahodatnoma va baholar ilovasini rus tiliga tarjima qilib, notarial tasdiqlang.", "Подготовьте паспорт, аттестат и приложение с переводом на русский, заверенным нотариусом."],
  "Fill in the online application and take the university's entrance tests or interview; some can be taken online.": ["Onlayn arizani to'ldiring va universitetning kirish testlari yoki suhbatini topshiring; ayrimlarini onlayn topshirish mumkin.", "Заполните онлайн-заявку и пройдите вступительные испытания или собеседование; некоторые можно пройти онлайн."],
  "If you will study in Russian and need more practice, plan a one-year preparatory faculty.": ["Rus tilida o'qisangiz va ko'proq mashq kerak bo'lsa, bir yillik tayyorlov fakultetini rejalashtiring.", "Если будете учиться на русском и нужна практика, запланируйте год на подготовительном факультете."],
  "After admission, follow the university's instructions for entry and registration in Russia.": ["Qabul qilingach, Rossiyaga kirish va ro'yxatdan o'tish bo'yicha universitet ko'rsatmalariga amal qiling.", "После зачисления следуйте инструкциям университета по въезду и регистрации в России."],
  "Choose the route: the MEXT scholarship through the Embassy of Japan in Tashkent (usually in spring), or apply directly to {0}.": ["Yo'lni tanlang: Toshkentdagi Yaponiya elchixonasi orqali MEXT granti (odatda bahorda) yoki to'g'ridan-to'g'ri {0}ga.", "Выберите путь: стипендия MEXT через посольство Японии в Ташкенте (обычно весной) или подача напрямую в {0}."],
  "For direct entry, check whether {0} asks for the EJU exam or its own test, and the English level for English-taught courses (about IELTS {1}).": ["To'g'ridan-to'g'ri kirish uchun {0} EJU imtihonini yoki o'z testini so'rashini va ingliz tilidagi kurslar uchun til darajasini (taxminan IELTS {1}) tekshiring.", "При прямой подаче проверьте, требует ли {0} экзамен EJU или собственный тест, и уровень английского для программ на английском (около IELTS {1})."],
  "Prepare your certificate, transcript, passport, a study plan and recommendation letters.": ["Shahodatnoma, baholar ilovasi, pasport, o'qish rejasi va tavsiyanomalarni tayyorlang.", "Подготовьте аттестат, приложение, паспорт, учебный план и рекомендательные письма."],
  "Submit the online application and pay the fee.": ["Onlayn ariza topshiring va to'lovni qiling.", "Подайте онлайн-заявку и оплатите сбор."],
  "After admission the university applies for your Certificate of Eligibility. With it you get a student visa at the Embassy of Japan in Tashkent.": ["Qabul qilingach, universitet siz uchun Certificate of Eligibility so'raydi. U bilan Toshkentdagi Yaponiya elchixonasida talaba vizasini olasiz.", "После зачисления университет запросит для вас Certificate of Eligibility. С ним вы получите студенческую визу в посольстве Японии в Ташкенте."],
  "Open the international admissions page of {0} and note the programme, the requirements and the deadline.": ["{0}ning xalqaro qabul sahifasini oching va dastur, talablar va muddatni yozib oling.", "Откройте страницу приёма иностранных студентов {0} и запишите программу, требования и срок."],
  "Prepare your passport, school certificate and transcript, translated into the language of instruction.": ["Pasport, maktab shahodatnomasi va baholar ilovasini o'qish tiliga tarjima qilib tayyorlang.", "Подготовьте паспорт, аттестат и приложение с переводом на язык обучения."],
  "Take the tests the university asks for: usually an English test (about IELTS {1}) and sometimes the SAT or the university's own exam.": ["Universitet so'ragan testlarni topshiring: odatda ingliz tili testi (taxminan IELTS {1}), ba'zan SAT yoki universitetning o'z imtihoni.", "Сдайте тесты, которые требует университет: обычно английский (около IELTS {1}), иногда SAT или собственный экзамен."],
  "Fill in the online application, upload your documents and motivation letter, and pay the fee if there is one.": ["Onlayn arizani to'ldiring, hujjatlar va motivatsion xatni yuklang, to'lov bo'lsa, to'lang.", "Заполните онлайн-заявку, загрузите документы и мотивационное письмо и оплатите сбор, если он есть."],
  "Apply for scholarships at the same time; their deadlines are often earlier.": ["Grantlarga ham bir vaqtda ariza bering; ularning muddati ko'pincha ertaroq.", "Одновременно подайте на стипендии: их сроки часто раньше."],
  "When you receive the offer, accept it, pay any deposit and ask for the documents you need for the student visa.": ["Taklif kelganda uni qabul qiling, depozit bo'lsa, to'lang va talaba vizasi uchun kerakli hujjatlarni so'rang.", "Получив предложение, примите его, внесите депозит, если нужно, и запросите документы для студенческой визы."],
  "Apply for the student visa at the embassy that serves Uzbekistan, and arrange housing.": ["O'zbekistonga xizmat ko'rsatadigan elchixonada talaba vizasiga ariza bering va turar joyni hal qiling.", "Подайте на студенческую визу в посольство, обслуживающее Узбекистан, и решите вопрос с жильём."],
  "Open the admissions page of {0} for foreign students and note the programme, the requirements and the deadline.": ["{0}ning xorijlik talabalar uchun qabul sahifasini oching va dastur, talablar va muddatni yozib oling.", "Откройте страницу приёма иностранцев {0} и запишите программу, требования и срок."],
  "Take the university's entrance test or interview if it has one.": ["Universitetda kirish testi yoki suhbat bo'lsa, topshiring.", "Пройдите вступительный тест или собеседование, если они есть."],
  "Fill in the application, upload your documents and motivation letter, and pay the fee if there is one.": ["Arizani to'ldiring, hujjatlar va motivatsion xatni yuklang, to'lov bo'lsa, to'lang.", "Заполните заявку, загрузите документы и мотивационное письмо и оплатите сбор, если он есть."],
  "When you receive the offer, accept it and ask for the documents you need for entry and registration.": ["Taklif kelganda uni qabul qiling va kirish hamda ro'yxatdan o'tish uchun kerakli hujjatlarni so'rang.", "Получив предложение, примите его и запросите документы для въезда и регистрации."],

    const txt = state.letter.text || "";
    const done = () => { el.textContent = t("Copied"); };
    try { navigator.clipboard.writeText(txt).then(done, () => { el.textContent = t("Select and copy the text from the letter editor."); }); } catch (e) { el.textContent = t("Select and copy the text from the letter editor."); }
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "mclose" && el.classList.contains("modal-bg") && e.target.closest("[data-stop]")) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalRoot.firstChild) closeModal(); });
document.addEventListener("change", e => {
  const el = e.target;
  if (!el.isConnected) return; /* a re-render removed this field; ignore its late change event */
  if (el.id === "r-reg") { const d = $("#r-dist"); if (d) d.innerHTML = placeOptions(el.value, ""); return; }
  if (el.dataset && el.dataset.setplace) { setPlace(el.value); return; }
  if (state && el.dataset && el.dataset.cur) {
    const bi = $("#p-b"); if (bi) state.pf.budget = bi.value; const old = state.pf.cur, b = parseFloat(state.pf.budget); state.pf.cur = el.value;
    if (b > 0) { const q = el.value === "UZS" ? 1e5 : 1; state.pf.budget = String(Math.round(toUSD(b, old) * CURS[el.value].r / q) * q); }
    save(); keepScroll(render); return;
  }
  if (el.dataset && el.dataset.changeTest) {
    const none = el.value === "none", w = $("#tv-wrap");
    if (w) w.style.display = none ? "none" : "";
    $("#tv").innerHTML = testOptsHTML(el.value); return;
  }
  if (!state) return;
  if (el.dataset.change === "ach") { if (el.checked) state.ans.a[el.dataset.id] = true; else delete state.ans.a[el.dataset.id]; save(); return; }
  if (el.dataset.bind) {
    const v = el.type === "checkbox" ? el.checked : el.value, b = el.dataset.bind;
    if (b === "chosen") { state.chosen = v; state.letter.text = ((state.drafts || {})[v] || {}).text || ""; state.letter.outline = null; state.letter.review = null; state.submitted = null; }
    else setPath(state, b, v);
    if (b === "pf.scale") { state.pf.gpa = ""; state.pf.subj = {}; }
    save();
    if (b === "letter.lang") { afterLangChange(); return; }
    if (el.dataset.rerender === "1") keepScroll(render);
    else if (state.step === 3 && !state.tool) updateStrength();
    else keepScroll(render);
  }
});
let inT = 0;
document.addEventListener("input", e => {
  const el = e.target;
  if (!state) return;
  if (el.dataset.bind && state.step === 3 && el.type === "number") { setPath(state, el.dataset.bind, el.value); save(); updateStrength(); const be = $("#bud-eq"); if (be && el.dataset.bind === "pf.budget") be.textContent = budEq(); return; }
  if (el.dataset.input === "cq") { state.ui.cq = el.value; $("#cgrid").innerHTML = countryTiles(); }
  else if (el.dataset.input === "usearch") { clearTimeout(inT); inT = setTimeout(() => { state.ui.usearch = el.value; state.ui.ushow = 30; const pos = el.selectionStart; keepScroll(render); const n = $("#usearch"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
  else if (el.dataset.input === "ltext") {
    state.letter.text = el.value; if (state.chosen) (state.drafts = state.drafts || {})[state.chosen] = { text: el.value, at: Date.now() }; const w = wordCount(el.value);
    $("#wc").textContent = w + " " + t("words"); $("#rbtn").disabled = w < 40; const fb = $("#frbtn"); if (fb) fb.disabled = w < 40;
    clearTimeout(inT); inT = setTimeout(() => { const q = $("#qc"); if (q) q.innerHTML = checklistHTML(state.letter.text); save(); }, 500);
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "reg") doRegister(f); else doLogin(f);
});

window.addEventListener("focus", () => { if (state && state.tool === "tg" && session.tg && session.tg.on && !session.tg.linked) tgCheck(); });
/* ---------- boot ---------- */
(function boot() {
  if (location.hash.indexOf("#r=") === 0) { try { SHARED = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3))))); } catch (e) {} if (SHARED) { render(); return; } }
  if (AI_CONFIG.endpoint) fetch(AI_CONFIG.endpoint.replace(/\/$/, "") + "/data").then(r => r.json()).then(j => { LIVE = { deadlines: j.deadlines || {}, tuition: j.tuition || {}, updated: j.updated || "" }; Object.keys(j.rates || {}).forEach(k => { if (CURS[k] && +j.rates[k] > 0) CURS[k].r = +j.rates[k]; }); if (state) render(); }).catch(() => {});
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  const em = store.get("yolim2:session"), users = readJSON("yolim2:users", {});
  if (em && users[em]) { openSession(users[em]); return; }
  authTab = Object.keys(users).length ? "login" : "reg";
  render();
})();
})();
</script>
